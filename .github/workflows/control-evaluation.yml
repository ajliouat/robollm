name: Grounded control checks

on:
  push:
    branches: [main, codex/grounded-control-evaluation, codex/reaching-control-diagnostics, codex/stationary-reaching-contract]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  control:
    name: CPU grounding and evaluation regressions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned simulation and test dependencies
        run: >-
          python -m pip install
          numpy==2.4.2 mujoco==3.14.0 gymnasium==1.3.0 pytest==9.1.1
      - name: Check grounding, executor semantics and evaluation artifacts
        run: >-
          python -m pytest
          tests/test_v104.py tests/test_v106.py tests/test_v107.py
          tests/test_benchmark_reproducibility.py
          tests/test_pipeline_grounding.py tests/test_grounded_control.py
          tests/test_arm_control.py tests/test_control_repair.py
          tests/test_stationary_contract.py tests/test_stationary_policy.py tests/test_stationary_study.py
          --junitxml=runs/control-tests.xml
      - name: Run development-seed control smoke
        run: >-
          python -m evaluation.grounded_control
          --seeds 17 18 --output runs/control-ci.json
      - name: Run paired repair development smoke
        run: >-
          python -m evaluation.control_repair
          --seeds 17 18 --output runs/control-repair-ci.json.gz
      - name: Run stationary-standoff development smoke
        run: >-
          python -m evaluation.stationary_reach
          --seeds 17 18 --output runs/stationary-ci.json.gz
      - name: Retain smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grounded-control-smoke
          path: |
            runs/control-ci.json
            runs/control-repair-ci.json.gz
            runs/stationary-ci.json.gz
            runs/control-tests.xml
          if-no-files-found: error
